<!DOCTYPE html>
<html lang="so">
<head>

    :root {
      --navy: #1A365D;
      --navy-dark: #0F223D;
      --blue: #2B6CB0;
      --blue-surface: #EBF8FF;
      --green: #2F855A;
      --amber: #D69E2E;
      --red: #E53E3E;
      --bg: #F1F5F9;
      --text: #1E293B;
      --muted: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1E3A8A 0%, #0F223D 65%, #071224 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #fff;
    }
    .preview-header { text-align: center; margin-bottom: 12px; max-width: 520px; }
    .preview-badge {
      display: inline-block;
      background: rgba(214, 158, 46, 0.2);
      border: 1px solid rgba(214, 158, 46, 0.55);
      color: #FBD38D;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .preview-tip { font-size: 11.5px; color: #CBD5E1; line-height: 1.5; }
    .preview-tip code { color: #90CDF4; font-weight: 700; background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; }
    .phone {
      width: 390px;
      max-width: 100%;
      height: 780px;
      max-height: 88vh;
      background: #0B1120;
      border-radius: 42px;
      padding: 12px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.65), 0 0 0 2px rgba(255,255,255,0.16);
      display: flex;
      flex-direction: column;
    }
    .phone-screen {
      flex: 1;
      background: var(--bg);
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--text);
      position: relative;
    }
    .notch {
      width: 116px;
      height: 20px;
      background: #0B1120;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      margin: 0 auto;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }
    .app-topbar {
      background: var(--navy);
      color: #fff;
      padding: 26px 14px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; }
    .back-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
    }
    .app-topbar-title { font-size: 14px; font-weight: 800; }
    .app-topbar-sub { font-size: 11px; color: #90CDF4; }
    .lang-pill {
      background: var(--navy-dark);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .class-bar {
      background: var(--blue-surface);
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      border-bottom: 1px solid #CBD5E1;
      flex-shrink: 0;
    }
    .screen-body { flex: 1; overflow-y: auto; padding: 13px; }
    .welcome-bg { background: linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%); color: #fff; text-align: center; }
    .logo-circle { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--amber); margin: 8px auto 12px; overflow: hidden; background: #fff; }
    .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
    .single-badge {
      display: inline-block;
      background: rgba(43, 108, 176, 0.35);
      border: 1px solid rgba(214, 158, 46, 0.65);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .role-card { text-align: left; border-radius: 14px; padding: 14px; margin-bottom: 11px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); transition: transform 0.12s ease; }
    .role-card:hover { transform: scale(1.01); }
    .role-admin { background: linear-gradient(90deg, #1E3A8A, #172554); }
    .role-teacher { background: linear-gradient(90deg, #1E40AF, #1E293B); }
    .role-parent { background: linear-gradient(90deg, #065F46, #0F172A); }
    .role-title { font-size: 15px; font-weight: 800; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .role-tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.16); }
    .role-desc { font-size: 11px; color: #CBD5E1; margin-top: 5px; line-height: 1.4; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat-box {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.12s, transform 0.1s;
    }
    .stat-box:hover { transform: translateY(-1px); }
    .stat-box.selected { border-color: var(--navy); background: #F8FAFC; }
    .stat-label { font-size: 10px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
    .stat-val { font-size: 18px; font-weight: 800; color: var(--navy); margin-top: 2px; }
    .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .card-title { font-size: 13px; font-weight: 800; color: var(--navy); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    .badge-green { background: #C6F6D5; color: #22543D; }
    .badge-amber { background: #FEEBC8; color: #7B341E; }
    .badge-red { background: #FED7D7; color: #742A2A; }
    .badge-blue { background: #BEE3F8; color: #2A4365; }
    .btn {

      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;

    .btn-blue { background: var(--blue); color: #fff; }
    .btn-amber { background: var(--amber); color: #000; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #CBD5E1; color: var(--navy); }
    .btn-sm { padding: 5px 8px; font-size: 10.5px; }
    .btn-full { width: 100%; }
    .input, .select {

      border-radius: 8px;
      border: 1px solid #CBD5E1;
      font-size: 12px;
      margin-bottom: 8px;
      outline: none;

    .avatar {

      color: var(--navy);

      align-items: center;

    .att-btn {

      border: none;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;

    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .chip {

    .bottom-nav {

    .nav-btn {

    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.68);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 30;
    }
    .modal-box {
      background: #fff;
      color: var(--text);
      border-radius: 16px;
      padding: 14px;
      width: 100%;
      max-height: 88%;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }
    .toast {
      position: absolute;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: #0F172A;
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      z-index: 40;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    /* Report Card Table */
    .rc-card {
      background: #fff;
      border: 1.5px solid var(--navy);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(26, 54, 93, 0.08);
    }
    .rc-header {
      background: linear-gradient(135deg, var(--navy), #1E40AF);
      color: #fff;
      padding: 11px 12px;
    }
    .rc-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .rc-table th {
      background: #EBF8FF;
      color: var(--navy);
      text-align: left;
      padding: 7px 8px;
      font-weight: 800;
      border-bottom: 1px solid #CBD5E1;
    }
    .rc-table td { padding: 6.5px 8px; border-bottom: 1px solid #F1F5F9; }
    .rc-table tr:nth-child(even) td { background: #F8FAFC; }
    .rc-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: #F1F5F9;
      padding: 8px;
      text-align: center;
      font-size: 10.5px;
    }
    .rc-remark {
      background: #FFFBEB;
      border-top: 1px solid #FDE68A;
      padding: 8px 10px;
      font-size: 11px;
      color: #78350F;
    }
  </style>
</head>

    function showToast(msg) {
      const el = document.getElementById('toastContainer');
      el.innerHTML = `<div class="toast">${msg}</div>`;
      setTimeout(() => { el.innerHTML = ''; }, 2500);
    }

    function toggleLang() {
      state.lang = state.lang === 'so' ? 'en' : 'so';
      render();
    }

    function goHome() {
      state.portal = 'HOME';
      state.tab = 'DASHBOARD';
      render();
    }

    function setTab(t) {
      state.tab = t;

    function closeModal() {
      document.getElementById('modalContainer').innerHTML = '';
    }

    function avatarHtml(person) {
      if (person.photo) return `<div class="avatar"><img src="${person.photo}" alt="${person.name}" /></div>`;
      const init = (person.name || 'I')[0].toUpperCase();
      return `<div class="avatar">${init}</div>`;
    }

    function gradeFromPct(pct) {
      if (pct >= 90) return 'A+';
      if (pct >= 80) return 'A';
      if (pct >= 70) return 'B';
      if (pct >= 60) return 'C';
      if (pct >= 50) return 'D';
      return 'F';
    }

    function computeExamResults(exam) {
      const classStudents = state.students.filter(s => s.classId === exam.classId);
      const totalMax = exam.subjects.length * exam.maxPerSub;
      const rows = classStudents.map(st => {
        const stMarks = exam.marks[st.id] || {};
        let total = 0;
        exam.subjects.forEach(sub => { total += Number(stMarks[sub] || 0); });
        const pct = totalMax > 0 ? (total / totalMax) * 100 : 0;
        return {
          student: st,
          stMarks,
          total,
          totalMax,
          pct,
          grade: gradeFromPct(pct),
          remark: (exam.remarks && exam.remarks[st.id]) || ''
        };
      }).sort((a, b) => b.total - a.total);
      let pos = 0;
      rows.forEach((r, idx) => {
        if (idx === 0 || r.total !== rows[idx - 1].total) pos = idx + 1;
        r.pos = pos;
      });
      return rows;
    }

    function buildReportCardHtml(exam, row, isSo) {
      return `
        <div class="rc-card">
          <div class="rc-header">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="font-size:13px;font-weight:800;">${row.student.name}</div>
                <div style="font-size:10.5px;color:#CBD5E1;">${row.student.id} • ${exam.className} • ${exam.name}</div>
              </div>
              <div style="text-align:right;">
                <span class="badge badge-amber">#${row.pos}</span>
                <span class="badge badge-green">${row.grade}</span>
              </div>
            </div>
          </div>
          <table class="rc-table">
            <thead>
              <tr>
                <th>${isSo ? 'Maaddo' : 'Subject'}</th>
                <th style="text-align:center;">${isSo ? 'Ugu Badan' : 'Max'}</th>
                <th style="text-align:center;">${isSo ? 'Buundo' : 'Score'}</th>
                <th style="text-align:center;">${isSo ? 'Darajo' : 'Grade'}</th>
              </tr>
            </thead>
            <tbody>
              ${exam.subjects.map(sub => {
                const sc = Number(row.stMarks[sub] || 0);
                const g = gradeFromPct((sc / exam.maxPerSub) * 100);
                return `<tr>
                  <td><strong>${sub}</strong></td>
                  <td style="text-align:center;">${exam.maxPerSub}</td>
                  <td style="text-align:center;font-weight:800;color:var(--navy);">${sc}</td>
                  <td style="text-align:center;"><span class="badge ${g.startsWith('A') ? 'badge-green' : 'badge-blue'}">${g}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          <div class="rc-summary">
            <div><div style="color:var(--muted);">${isSo?'Wadar':'Total'}</div><strong>${row.total}/${row.totalMax}</strong></div>
            <div><div style="color:var(--muted);">${isSo?'Boqolley':'Percent'}</div><strong>${row.pct.toFixed(1)}%</strong></div>

      const stId = document.getElementById('roomStId').value.trim().toUpperCase();

        <div class="modal-overlay" onclick="closeModal()">

            <input class="input" id="tPhone" placeholder="${isSo?'Telefoonka':'Phone'}" value="${existing?existing.phone:'+252 61 '}" />
            <input class="input" id="tEmail" placeholder="${isSo?'Iimaylka':'Email'}" value="${existing?existing.email:''}" />
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">${isSo?'Sawirka Macallinka (Ikhtiyaari - waad ka boodi kartaa):':'Teacher Photo (Optional):'}</label>
            <input class="input" type="file" id="tPhotoFile" accept="image/*" />
            <div style="display:flex;gap:8px;justify-content:flex-end;">
              <button class="btn btn-outline" onclick="closeModal()">${isSo?'Jooji':'Cancel'}</button>
              <button class="btn btn-navy" onclick="saveTeacher('${teacherId || ''}')">${isSo?'Keydi':'Save'}</button>
            </div>
          </div>
        </div>
      `;

    function saveTeacher(teacherId) {
      const name = document.getElementById('tName').value.trim();
      const phone = document.getElementById('tPhone').value.trim();
      const email = document.getElementById('tEmail').value.trim();
      if (!name) return;
      const fileInput = document.getElementById('tPhotoFile');
      const finishSave = (photoData) => {
        if (teacherId) {
          const t = state.teachers.find(x => x.id === teacherId);
          t.name = name; t.phone = phone; t.email = email;
          if (photoData) t.photo = photoData;
          state.classes.forEach(c => { if (c.teacherId === t.id) c.teacherName = t.name; });
        } else {
          state.teachers.push({ id: 'T' + Date.now(), name, phone, email, photo: photoData || '' });
        }
        closeModal();
        showToast(state.lang === 'so' ? 'Macallinka waa la keydiyay!' : 'Teacher saved!');
        render();
      };
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = e => finishSave(e.target.result);
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        finishSave('');
      }
    }

      const isSo = state.lang === 'so';
      const existing = classId ? state.classes.find(c => c.id === classId) : null;
      document.getElementById('modalContainer').innerHTML = `

    function saveStudent(studentId) {
      const name = document.getElementById('stName').value.trim();
      const phone = document.getElementById('stPhone').value.trim();
      if (!name) return;
      const cls = state.classes.find(c => c.id === state.selectedClassId);
      const fileInput = document.getElementById('stPhotoFile');
      const finish = (photoData) => {
        if (studentId) {
          const st = state.students.find(s => s.id === studentId);
          st.name = name; st.phone = phone;
          if (photoData) st.photo = photoData;
        } else {
          const id = 'IFT-' + (101 + state.students.length);
          const code = String(Math.floor(100000 + Math.random() * 900000));
          state.students.push({ id, name, classId: cls.id, className: cls.name, code, phone, photo: photoData || '' });
          state.attendanceToday[id] = 'P';
        }
        closeModal();
        showToast(state.lang === 'so' ? 'Ardayga waa la keydiyay!' : 'Student saved!');
        render();
      };
      if (fileInput.files && fileInput.files[0]) {
        const r = new FileReader();
        r.onload = e => finish(e.target.result);
        r.readAsDataURL(fileInput.files[0]);
      } else finish('');
    }

              const p = ff.payments[s.id] || { status: 'UNPAID', receipt: '' };
              return `
                <div class="row-item">
                  <div>
                    <strong>${s.name}</strong>
                    <div style="font-size:10.5px;color:var(--muted);">${s.id} ${p.receipt ? '• ' + p.receipt : ''}</div>
                  </div>
                  ${p.status === 'PAID'
                    ? `<span class="badge badge-green">✓ PAID</span>`
                    : `<button class="btn btn-green btn-sm" onclick="markStudentFeePaid('${ff.id}','${s.id}')">${isSo?'Bixiyay':'Paid'}</button>`}
                </div>
              `;
            }).join('')}
            <button class="btn btn-outline btn-full" style="margin-top:10px;" onclick="closeModal()">${isSo?'Xir':'Close'}</button>
          </div>
        </div>
      `;
    }

    function submitFeeFolderToParents(folderId) {
      const ff = state.feeFolders.find(f => f.id === folderId);
      ff.published = true;
      state.students.filter(s => s.classId === ff.classId).forEach(s => {
        state.parentNotifications.unshift({
          studentId: s.id,
          title: state.lang === 'so' ? `Fii Cusub: ${ff.title}` : `New Fee: ${ff.title}`,
          msg: state.lang === 'so' ? `Qaddarka: $${ff.amount} • Xilliga: ${ff.dueDate}` : `Amount: $${ff.amount} • Due: ${ff.dueDate}`,
          date: '2026-11-13',
          receipt: ''
        });
      });
      showToast(state.lang === 'so' ? 'Dhammaan qolalka waalidiinta waa loo gudbiyay!' : 'Submitted to all Parent Rooms!');
      openTeacherFeeFolderModal(folderId);
      render();
    }

    function markStudentFeePaid(folderId, studentId) {
      const ff = state.feeFolders.find(f => f.id === folderId);
      const rcp = 'RCP-' + Math.floor(10000 + Math.random() * 89999);
      ff.payments[studentId] = { status: 'PAID', receipt: rcp, date: '2026-11-13' };
      state.parentNotifications.unshift({
        studentId,
        title: (state.lang === 'so' ? 'Rasiidka Fiiga • ' : 'Fee Receipt • ') + rcp,
        msg: state.lang === 'so'
          ? `${ff.title} ($${ff.amount}) waa la bixiyay. Lambarka rasiidka: ${rcp}`
          : `${ff.title} ($${ff.amount}) paid. Receipt: ${rcp}`,
        date: '2026-11-13',
        receipt: rcp
      });
      showToast(state.lang === 'so' ? `Rasiid (${rcp}) ayaa u dhacay waalidka!` : `Receipt (${rcp}) sent to Parent!`);
      openTeacherFeeFolderModal(folderId);
    }

    // =========================================================
    // PARENT LOGIC
    // =========================================================
    function renderParentTab(body, isSo) {
      const child = state.students.find(s => s.id === state.selectedChildId) || state.students[0];
      const chipsHtml = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <strong style="font-size:12px;color:var(--navy)">${isSo?'Carruurtaada':'Linked Children'}</strong>
          <button class="btn btn-green btn-sm" onclick="openLinkChildModal()">+ ${isSo?'Ku Dar Arday':'Add Child'}</button>
        </div>
        <div class="chips" style="margin-bottom:10px;">
          ${state.linkedChildren.map(cid => {
            const st = state.students.find(s => s.id === cid);
            if (!st) return '';
            return `<button class="chip ${st.id===child.id?'active':''}" onclick="state.selectedChildId='${st.id}';render();">${st.name}</button>`;
          }).join('')}
        </div>
      `;

      let content = '';
      if (state.tab === 'RESULTS') {
        const pubExams = state.exams.filter(e => e.status === 'PUBLISHED' && e.classId === child.classId);
        content = pubExams.length === 0
          ? `<div class="card"><p style="font-size:12px;color:var(--muted)">${isSo?'Weli lama daabicin imtixaan.':'No published exams yet.'}</p></div>`
          : pubExams.map(ex => {
              const rows = computeExamResults(ex);
              const myRow = rows.find(r => r.student.id === child.id);
              return myRow ? buildReportCardHtml(ex, myRow, isSo) : '';
            }).join('');
      } else if (state.tab === 'ATTENDANCE') {
        const groups = { PRESENT: [], ABSENT: [], LATE: [], EXCUSED: [] };
        state.attendanceHistory.forEach(h => {
          const code = h.records[child.id];
          const dayLabel = isSo ? h.daySo : h.dayEn;
          const [y, m, d] = h.date.split('-');
          const formatted = `${dayLabel} ${d}/${m}/${y}`;
          if (code === 'P') groups.PRESENT.push(formatted);
          else if (code === 'A') groups.ABSENT.push(formatted);
          else if (code === 'L') groups.LATE.push(formatted);
          else if (code === 'E') groups.EXCUSED.push(formatted);
        });
        const sel = state.selectedAttFilter;
        const selectedDates = groups[sel] || [];
        content = `
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">
            ${isSo ? 'Taabo mid ka mid ah si aad u aragto maalinta & taariikhda:' : 'Tap any stat to view day & date:'}
          </div>
          <div class="stat-grid">
            <div class="stat-box ${sel==='PRESENT'?'selected':''}" onclick="state.selectedAttFilter='PRESENT';render();">
              <div class="stat-label"><span>${isSo?'Jooga':'Present'}</span></div>
              <div class="stat-val" style="color:var(--green)">${groups.PRESENT.length}</div>
            </div>
            <div class="stat-box ${sel==='ABSENT'?'selected':''}" onclick="state.selectedAttFilter='ABSENT';render();">
              <div class="stat-label"><span>${isSo?'Maqan':'Absent'}</span></div>
              <div class="stat-val" style="color:var(--red)">${groups.ABSENT.length}</div>
            </div>
            <div class="stat-box ${sel==='LATE'?'selected':''}" onclick="state.selectedAttFilter='LATE';render();">
              <div class="stat-label"><span>${isSo?'Soo Daahay':'Late'}</span></div>
              <div class="stat-val" style="color:var(--amber)">${groups.LATE.length}</div>
            </div>
            <div class="stat-box ${sel==='EXCUSED'?'selected':''}" onclick="state.selectedAttFilter='EXCUSED';render();">
              <div class="stat-label"><span>${isSo?'Cudurdaar':'Excused'}</span></div>
              <div class="stat-val" style="color:var(--blue)">${groups.EXCUSED.length}</div>
            </div>
          </div>
          <div class="card">
            <div class="card-title"><span>${sel} (${selectedDates.length})</span></div>
            ${selectedDates.length === 0
              ? `<p style="font-size:12px;color:var(--muted)">${isSo?'Ma jiraan diiwaan noocan ah.':'No dates recorded.'}</p>`
              : selectedDates.map((dt, idx) => `<div class="row-item"><span><strong>${idx+1}.</strong> ${dt}</span></div>`).join('')}
          </div>
        `;
      } else if (state.tab === 'FEES') {
        const myFees = state.feeFolders.filter(ff => ff.published && ff.classId === child.classId);
        const myNotifs = state.parentNotifications.filter(n => n.studentId === child.id);
        content = `
          ${myFees.map(ff => {
            const p = ff.payments[child.id] || { status: 'UNPAID', receipt: '' };
            return `
              <div class="card">
                <div class="card-title"><span>${ff.title}</span><span class="badge ${p.status==='PAID'?'badge-green':'badge-red'}">${p.status}</span></div>
                <div style="font-size:11.5px;color:var(--muted);">$${ff.amount} • Due: ${ff.dueDate} ${p.receipt ? '• <strong>' + p.receipt + '</strong>' : ''}</div>
              </div>
            `;
          }).join('')}
          <strong style="font-size:12.5px;color:var(--navy);display:block;margin:8px 0 6px;">${isSo?'Ogeysiisyada & Rasiidyada Fiiga':'Fee Notifications & Receipts'}</strong>
          ${myNotifs.length === 0
            ? `<div class="card"><p style="font-size:12px;color:var(--muted)">${isSo?'Weli fariin fiiga ma soo dhicin.':'No fee notifications yet.'}</p></div>`
            : myNotifs.map(n => `
              <div class="card" style="border-left:4px solid ${n.receipt?'var(--green)':'var(--blue)'};">
                <div class="card-title"><span>${n.title}</span><span style="font-size:10px;color:var(--muted)">${n.date}</span></div>
                <div style="font-size:11.5px;">${n.msg}</div>
              </div>
            `).join('')}
        `;
      } else if (state.tab === 'REMARKS') {
        const myRemarks = state.remarks.filter(r => r.studentId === child.id);
        content = myRemarks.length === 0
          ? `<div class="card"><p style="font-size:12px;color:var(--muted)">${isSo?'Ma jirto fariin cusub.':'No remarks yet.'}</p></div>`
          : myRemarks.map(r => `
              <div class="card">
                <div class="card-title"><span>${r.cat}</span><span style="font-size:10px;color:var(--muted)">${r.date}</span></div>
                <div style="font-size:12px;margin-bottom:4px;">${r.msg}</div>
                <div style="font-size:10px;color:var(--muted)">— ${r.teacher}</div>
              </div>
            `).join('');
      }
      body.innerHTML = chipsHtml + content;
    }

    function openLinkChildModal() {
      const isSo = state.lang === 'so';
      document.getElementById('modalContainer').innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal-box" onclick="event.stopPropagation()">
            <div class="card-title">${isSo?'Ku Dar Arday':'Link Student'}</div>
            <p style="font-size:11px;color:var(--muted);margin-bottom:8px;">Demo: IFT-102 / 831942</p>
            <input class="input" id="linkStId" value="IFT-102" />
            <input class="input" id="linkStCode" value="831942" />
            <div style="display:flex;gap:8px;justify-content:flex-end;">
              <button class="btn btn-outline" onclick="closeModal()">${isSo?'Jooji':'Cancel'}</button>
              <button class="btn btn-green" onclick="confirmLinkChild()">${isSo?'Xiriiri':'Link'}</button>
            </div>
          </div>
        </div>
      `;
    }

    function confirmLinkChild() {
      const id = document.getElementById('linkStId').value.trim().toUpperCase();
      const code = document.getElementById('linkStCode').value.trim();
      const found = state.students.find(s => s.id === id && s.code === code);
      if (found) {
        if (!state.linkedChildren.includes(found.id)) state.linkedChildren.push(found.id);
        state.selectedChildId = found.id;
        closeModal();
        showToast(state.lang === 'so' ? `${found.name} waa la xiriiriyay!` : `${found.name} linked!`);
        render();
      } else {
        showToast(state.lang === 'so' ? 'ID ama Code waa khalad!' : 'Invalid Student ID or Code!');
      }
    }

    render();
  </script>
</body>
</html>
